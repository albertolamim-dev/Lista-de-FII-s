name: Extrator de FIIs

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

jobs:
  extrair:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install yfinance pandas openpyxl

    - name: Debug - Verify Installations
      run: python -m pip list

    - name: Run extrator script
      run: python extrator_fiis.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        git add relatorios/
        git commit -m "🤖 Relatório de FIIs atualizado" || echo "Nenhuma alteração para commitar"
        git push
