name: Robô Extrator de FIIs

# Quando este robô vai rodar?
on:
  schedule:
    # Roda toda sexta-feira (5) às 22:00 UTC (19:00 no horário de Brasília)
    - cron: '0 22 * * 5'
  
  # Permite que você clique em um botão no GitHub para rodar manualmente a qualquer hora
  workflow_dispatch: 

jobs:
  extrair_dados:
    runs-on: ubuntu-latest

    # Permissão necessária para o robô salvar o arquivo de volta no seu repositório
    permissions:
      contents: write

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar as bibliotecas (yfinance, pandas, openpyxl)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar o script de extração
      run: python extrator_fiis.py

    - name: Salvar a planilha gerada no repositório
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        git add relatorios/*.xlsx
        git commit -m "🤖 Relatório de FIIs atualizado automaticamente" || echo "Nenhuma alteração para commitar"
        git push
